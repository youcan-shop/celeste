name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'fonts/**'
      - .github/scripts/google-fonts.mjs
      - .github/workflows/pages.yaml

  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site
        run: |
          mkdir site
          cp -R fonts site/fonts
          node .github/scripts/google-fonts.mjs site/google-fonts.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
